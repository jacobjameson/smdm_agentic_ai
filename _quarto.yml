project:
  type: website
  output-dir: _site
  # ── PRE-WORK MODE ─────────────────────────────────────────────
  # Only the pre-work pages are rendered/published for now.
  # On course day, restore the full render list:
  #   - "*.qmd"
  #   - "exercises/*.qmd"
  #   - "slides/*.qmd"
  #   - "!templates/"
  # ...and restore the full sidebar (see git history for this file).
  render:
    - index.qmd
    - setup.qmd
    - game.qmd
    - git-basics.qmd
    - survey.qmd
    - "!templates/"

website:
  title: "Agentic Coding for Research"
  description: "SMDM short course: agentic coding, git/GitHub, and custom research workflows."
  site-url: "https://jacobjameson.com/smdm_agentic_ai/"
  repo-url: "https://github.com/jacobjameson/smdm_agentic_ai"
  repo-actions: [edit, issue]
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  navbar:
    background: primary
    pinned: true
    left:
      - text: "① Setup"
        file: setup.qmd
      - text: "② Terminal Trainer"
        file: game.qmd
      - text: "③ Git Basics"
        file: git-basics.qmd
    right:
      - icon: github
        href: https://github.com/jacobjameson/smdm_agentic_ai
        aria-label: GitHub
  sidebar:
    style: "docked"
    collapse-level: 2
    contents:
      - section: "Pre-work"
        contents:
          - text: "Home"
            file: index.qmd
          - text: "① Setup guide"
            file: setup.qmd
          - text: "② Terminal Trainer 🎮"
            file: game.qmd
          - text: "③ Git & GitHub Basics"
            file: git-basics.qmd
          - text: "Baseline survey ✏️"
            file: survey.qmd
  page-footer:
    left: "SMDM Short Course · Jacob Jameson, MS · Harvard University"
    right:
      - icon: github
        href: https://github.com/jacobjameson/smdm_agentic_ai

format:
  html:
    theme:
      - cosmo
      - assets/theme.scss
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    code-tools: false
    highlight-style: github
    link-external-newwindow: true
    link-external-icon: true
    smooth-scroll: true
    anchor-sections: true
    fig-responsive: true

execute:
  freeze: auto
  echo: true
  warning: false
